baseURL: "https://sudip-bista.github.io/"
languageCode: "en-us"
title: "Political Scientist & AI Red Teamer"
theme: ["PaperMod"]
enableRobotsTXT: true

params:
  env: production
  title: "SUDIP KAJI BISTA"
  description: "Political Science, Political Research, Political Strategy, AI Red Teaming and AI Security"
  keywords:
    - "Political Science"
    - "Political Research"
    - "Political Theory"
    - "Political Strategy"
    - "Public Policy"
    - "Governance"
    - "Policy Analysis"
    - "AI Red Teaming"
    - "AI Security"
    - "AI Research"
    - "AI & Governance"
    - "Portfolio"
    - "Articles"
    - "Blog"
    - "Writeups"
  author: "SUDIP KAJI BISTA"
  images: ["/logo.jpeg"]
  DateFormat: "January 2, 2006"

  defaultTheme: dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: false

  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  ## FAVICON CONFIG
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    android_chrome_192x192: "/android-chrome-192x192.png"
    android_chrome_512x512: "/android-chrome-512x512.png"

  ## WEBSITE LABEL
  label:
    text: "👑 SUDIP KAJI BISTA ♟️ :~$"
    iconHeight: 35

  ## PROFILE MODE
  profileMode:
    enabled: true
    title: "👑 SUDIP KAJI BISTA 👑"
    subtitle: "🏛️ Exploring New Political Theory with AI 🤖. Questioning What We Know 🧠. 🇳🇵👑 Aspiring Political Adviser & Strategist ♟️🎯. 🔍 Exploring Politics, Power & the Future."
    imageUrl: "/logo.jpeg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "profile image"

    buttons:
      - name: "Political Research"
        url: "/political-research/"
      - name: "Political Strategy"
        url: "/political-strategy/"
      - name: "Articles"
        url: "/articles/"
      - name: "Blog"
        url: "/blog/"
      - name: "About"
        url: "/about/"
      - name: "Ai  Research"
        url: "/ai- research/"


  ## HOME INFO MODE
  homeInfoParams:
    Title: "Hi there 👋 SUDIP BISTA Here!"
    Content: "Building and Breaking stuffs for fun and profit"

  ## SOCIAL ICONS
  socialIcons:
    - name: email
      url: "mailto:bistas933@gmail.com"
    - name: discord
      url: "https://discord.com/users/1141344142966927430"
    - name: hackthebox
      url: "https://app.hackthebox.com/profile/1415484"
    - name: tryhackme
      url: "https://tryhackme.com/p/KALOOBAAGH"
    - name: x
      url: "https://x.com/@KalooB52949"
    - name: linkedin
      url: "https://www.linkedin.com/in/sudip-kaji-bista?utm_source=share_via&utm_content=profile&utm_medium=member_android"
    - name: github
      url: "https://github.com/SUDIP-BISTA"

  ## ANALYTICS
  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  ## COVER
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    responsiveImages: false

  ## EDIT POST
  editPost:
    URL: "#"
    Text: "Suggest Changes"
    appendFilePath: true

  ## SEARCH
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys:
      - "title"
      - "permalink"
      - "summary"
      - "content"

# MENU
menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 5

    - identifier: research
      name: Research
      url: /research/
      weight: 10

    - identifier: archives
      name: Archives
      url: /archives/
      weight: 25

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30

    - identifier: search
      name: Search
      url: /search/
      weight: 35


## CODE HIGHLIGHTING
pygmentsUseClasses: true

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

## OUTPUTS
outputs:
  home:
    - HTML
    - RSS
    - JSON
